<title>Silver ステップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: スマホ縦長の1カラムアプリ。下にタブバー（ホーム／学ぶ／ノート／記録）。カードを縦に積み、主役は「今日の1問」 */
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#1b2333; --muted:#5e6b80; --line:#dbe2ea;
  --brand:#24408f; --brand-soft:#e5ebfa; --cta:#f2643a; --cta-ink:#ffffff; --cta-soft:#ffe7de;
  --ok:#139a66; --ok-soft:#daf3e8; --find:#7650dc; --find-soft:#eee8fd; --xp:#e9a514; --xp-soft:#fff2cf;
  --code:#f4f6f9; --code-ink:#1f2a3c; --shadow:0 6px 18px rgba(28,40,70,.08);
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Zen Kaku Gothic New",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --card:#192030; --ink:#e4e9f2; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fa8ff; --brand-soft:#1f2a4a; --cta:#ff8059; --cta-ink:#2a0d02; --cta-soft:#3d2219;
  --ok:#4fd39a; --ok-soft:#14352a; --find:#b59cff; --find-soft:#2a2347; --xp:#ffc94a; --xp-soft:#3a2f10;
  --code:#121927; --code-ink:#d6dfee; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --card:#192030; --ink:#e4e9f2; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fa8ff; --brand-soft:#1f2a4a; --cta:#ff8059; --cta-ink:#2a0d02; --cta-soft:#3d2219;
  --ok:#4fd39a; --ok-soft:#14352a; --find:#b59cff; --find-soft:#2a2347; --xp:#ffc94a; --xp-soft:#3a2f10;
  --code:#121927; --code-ink:#d6dfee; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.35}
button{font:inherit;color:inherit}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:13px 18px;font:800 1rem var(--f-display);cursor:pointer;background:var(--brand-soft);color:var(--brand);min-height:48px}
.btn.cta{background:var(--cta);color:var(--cta-ink)}
.btn.ok{background:var(--ok);color:var(--card)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.navb:focus-visible,.chip:focus-visible,.opt:focus-visible,.link:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
.link{background:none;border:none;color:var(--brand);font-weight:700;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
/* ヘッダー */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.hello h1{font-size:1.35rem;font-weight:800}
.hello p{margin:0;color:var(--muted);font-size:.85rem}
.lv{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;box-shadow:var(--shadow)}
.lv b{width:34px;height:34px;border-radius:50%;background:var(--xp);color:#2b1d00;display:grid;place-items:center;font:800 .95rem var(--f-display)}
.lv span{font:700 .72rem var(--f-display);color:var(--muted);line-height:1.25}
.xpbar{height:10px;border-radius:999px;background:var(--xp-soft);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--xp);border-radius:999px;transition:width .8s cubic-bezier(.3,.8,.3,1)}
/* 今日の1問 */
.hero{background-color:var(--cta);background-image:linear-gradient(135deg,var(--cta),color-mix(in srgb,var(--cta) 70%,var(--xp)));color:var(--cta-ink);border:none;position:relative;overflow:hidden}
.hero h2{font-size:1.45rem;font-weight:800}
.hero p{margin:4px 0 14px;opacity:.95}
.hero .btn{background:var(--card);color:var(--cta);width:100%;font-size:1.1rem}
.hero .deco{position:absolute;right:-14px;top:-18px;font:800 6rem var(--f-mono);opacity:.13;pointer-events:none}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hero .meta span{background:rgba(255,255,255,.22);border-radius:999px;padding:1px 10px;font:700 .75rem var(--f-display)}
.streak{display:flex;gap:12px;align-items:center}
.flame{width:46px;height:46px;flex:0 0 auto;border-radius:14px;background:var(--xp-soft);display:grid;place-items:center}
.streak h3{font-size:1.02rem}
.streak p{margin:0;font-size:.84rem;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qbtn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow);font:800 .84rem var(--f-display);text-align:center;min-width:0}
.qbtn small{font:500 .7rem var(--f-body);color:var(--muted)}
.qbtn .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.mission{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.mission:last-child{border-bottom:none}
.mission .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.mission.done .ck{background:var(--ok);border-color:var(--ok);color:var(--card)}
.mission .mt{flex:1;font-weight:500}
.mission.done .mt{color:var(--muted)}
.mission .mx{font:800 .74rem var(--f-display);color:var(--xp);white-space:nowrap}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sec-h h3{font-size:1rem}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--brand-soft);border-radius:14px;padding:10px;text-align:center}
.tile b{display:block;font:800 1.5rem var(--f-display);color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:.72rem;color:var(--muted)}
.sync{font-size:.72rem;color:var(--muted);text-align:center;margin-top:4px}
/* 下のタブ */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.navb{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--muted);font:700 .7rem var(--f-display);border-radius:12px;position:relative}
.navb[aria-current="page"]{color:var(--brand)}
.navb .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--find);color:#fff;border-radius:999px;font:800 .62rem var(--f-display);padding:0 6px;min-width:18px;text-align:center}
/* 選択画面 */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--brand-soft);border-radius:14px;padding:4px;gap:4px}
.seg button{border:none;background:none;border-radius:11px;padding:10px;font:800 .92rem var(--f-display);color:var(--brand);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font:700 .82rem var(--f-display);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--card)}
.chip small{font:600 .68rem var(--f-mono);opacity:.75}
.modeinfo{font-size:.84rem;background:var(--code);border-radius:12px;padding:10px 12px}
/* 問題画面 */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qclose{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.qprog{flex:1;display:flex;gap:5px}
.qprog i{flex:1;height:8px;border-radius:999px;background:var(--line)}
.qprog i.ok{background:var(--ok)}.qprog i.find{background:var(--find)}.qprog i.now{background:var(--cta)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tag{font:700 .72rem var(--f-display);border-radius:999px;padding:2px 10px;background:var(--brand-soft);color:var(--brand)}
.stars{font:800 .72rem var(--f-display);color:var(--xp);letter-spacing:.05em}
.qtext{font-weight:700;margin:0 0 10px;font-size:1rem}
pre.code{margin:0 0 10px;background:var(--code);color:var(--code-ink);border-radius:12px;padding:10px 12px 10px 0;overflow-x:auto;font:400 .76rem/1.7 var(--f-mono);counter-reset:ln}
pre.code .l{display:block;white-space:pre}
pre.code .l::before{counter-increment:ln;content:counter(ln);display:inline-block;width:2.4em;padding-right:.8em;text-align:right;color:var(--muted);opacity:.55}
.cmd{font:600 .8rem var(--f-mono);background:var(--ink);color:var(--card);padding:8px 12px;border-radius:10px;margin:0 0 10px;overflow-x:auto;white-space:pre}
.helpers{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.helpers .chip{font-size:.78rem}
.hintbox{background:var(--xp-soft);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:.9rem;animation:rise .3s ease-out}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;cursor:pointer;min-height:52px;transition:transform .12s,border-color .15s}
.opt:active{transform:scale(.98)}
.opt .k{flex:0 0 auto;width:28px;height:28px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:800 .82rem var(--f-mono)}
.opt .t{flex:1;min-width:0;font:600 .9rem var(--f-mono);white-space:pre-wrap;word-break:break-word;padding-top:2px}
.opt .t.jp{font-family:var(--f-body)}
.opt.peek{border-color:var(--ok);border-style:dashed}
.opt.peek .k{background:var(--ok);color:var(--card)}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .k{background:var(--ok);color:var(--card)}
.opt.is-mine{border-color:var(--find);background:var(--find-soft)}
.opt.is-mine .k{background:var(--find);color:#fff}
.opt[disabled]{cursor:default}
.peeknote{font-size:.8rem;color:var(--ok);font-weight:700;margin:-2px 0 8px}
/* フィードバック */
.fb{border-radius:18px;padding:14px 16px;margin:14px 0 0;position:relative;overflow:hidden;animation:rise .35s cubic-bezier(.3,1.4,.5,1)}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.find{background:var(--find-soft);color:var(--find)}
.fb.peek{background:var(--brand-soft);color:var(--brand)}
.fb h2{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:8px}
.fb p{margin:2px 0 0;color:var(--ink);font-size:.9rem}
.fb .xpg{position:absolute;right:14px;top:14px;font:800 .9rem var(--f-display);color:var(--xp);background:var(--card);border-radius:999px;padding:2px 10px;animation:float 1.2s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes float{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:none}}
.exp{display:grid;gap:12px;margin-top:12px}
.exp .one{font-size:1rem;font-weight:500}
.flow{display:grid;gap:0}
.flow div{display:flex;gap:10px;align-items:flex-start}
.flow div b{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--card);display:grid;place-items:center;font:800 .74rem var(--f-display);position:relative;z-index:1}
.flow div span{font:600 .84rem var(--f-mono);padding:2px 0 12px;word-break:break-word}
.flow div:not(:last-child) b::after{content:"";position:absolute;top:24px;left:50%;width:2px;height:calc(100% + 14px);background:var(--brand-soft);transform:translateX(-50%);z-index:-1}
.flow div{position:relative}
.easy{background:var(--xp-soft);border-radius:14px;padding:12px 14px;animation:rise .3s ease-out}
.easy h3{font-size:.92rem;margin-bottom:4px}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;cursor:pointer;text-align:left;font:700 .8rem var(--f-mono);max-width:100%}
.word[aria-expanded="true"]{border-color:var(--brand);background:var(--brand-soft)}
.word small{display:block;font:500 .78rem var(--f-body);color:var(--ink);margin-top:2px}
.tipline{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;background:var(--code);border-radius:12px;padding:10px 12px}
.sticky-next{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px;z-index:5}
/* 結果・まとめ */
.big{text-align:center}
.big .num{font:800 3.2rem var(--f-display);color:var(--ok);line-height:1.1}
.big h1{font-size:1.5rem}
.done-list{display:grid;gap:8px}
.done-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.done-item .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.done-item b{font:800 1.15rem var(--f-display);margin-left:auto;font-variant-numeric:tabular-nums}
.rev{display:grid;gap:8px}
.revq{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.revq .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.revq .tx{flex:1;min-width:0}
.revq .tx b{display:block;font-size:.88rem}
.revq .tx span{font-size:.75rem;color:var(--muted)}
/* 記録 */
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chbar{display:grid;grid-template-columns:4.6em 1fr 3.4em;gap:8px;align-items:center;font-size:.8rem}
.chbar .bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.chbar .bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.chbar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bdg{text-align:center;font:700 .66rem var(--f-display);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.bdg .md{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--line);opacity:.5}
.bdg.on{color:var(--ink)}
.bdg.on .md{background:var(--xp-soft);opacity:1;box-shadow:0 0 0 3px var(--xp)}
/* 演出 */
.burst{position:fixed;left:50%;top:40%;pointer-events:none;z-index:60}
.burst i{position:absolute;width:9px;height:13px;border-radius:2px;animation:pop 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes pop{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.55);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lvup{background:var(--card);border-radius:24px;padding:26px 22px;text-align:center;max-width:340px;width:100%;animation:rise .45s cubic-bezier(.3,1.5,.5,1)}
.lvup .ring{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;background:var(--xp);display:grid;place-items:center;font:800 2.4rem var(--f-display);color:#2b1d00;box-shadow:0 0 0 8px var(--xp-soft)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);border-radius:999px;padding:8px 16px;font:700 .85rem var(--f-display);z-index:40;animation:rise .3s;max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;padding:18px 8px}
.empty .ic{width:64px;height:64px;border-radius:20px;background:var(--ok-soft);display:grid;place-items:center;margin:0 auto 8px}
/* ---- 追加：複数選択・解説の表・本番モード ---- */
.quick{grid-template-columns:repeat(2,minmax(0,1fr))}
.qbtn{flex-direction:row;justify-content:flex-start;text-align:left;padding:12px;gap:10px}
.qbtn .ic{flex:0 0 auto}
.qbtn span.lbl{display:flex;flex-direction:column;min-width:0}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);color:var(--card)}
.pickn{font:800 .72rem var(--f-display);background:var(--cta-soft);color:var(--cta);border-radius:999px;padding:2px 10px}
.flow div span{font:500 .88rem var(--f-body)}
.tbl{overflow-x:auto;margin-top:8px}
.tbl table{border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums;min-width:100%}
.tbl caption{text-align:left;font-size:.75rem;color:var(--muted);padding-bottom:4px}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
.tbl th{background:var(--code)}
.nl{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.nl li{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.nl .v{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 .78rem var(--f-display);margin-top:1px}
.nl .v.o{background:var(--ok-soft);color:var(--ok)}
.nl .v.x{background:var(--find-soft);color:var(--find)}
.nl .k{font:700 .82rem var(--f-mono);margin-right:4px}
.nl div{min-width:0}
.commit{margin-top:12px}
/* 本番モード */
.exam-card{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 65%,var(--find)));background-color:var(--brand);color:var(--card);border:none}
.exam-card h2{font-size:1.2rem}
.exam-card p{margin:2px 0 10px;opacity:.92;font-size:.88rem}
.exam-card .btn{background:var(--card);color:var(--brand);width:100%}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.facts b{display:block;font:800 1.5rem var(--f-display);color:var(--brand);line-height:1.2}
.facts span{font-size:.72rem;color:var(--muted)}
.kind{display:grid;gap:10px}
.kind button{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px;cursor:pointer}
.kind button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.kind b{font:800 1rem var(--f-display);display:block}
.kind small{color:var(--muted);font-size:.78rem}
.notes-list{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:.88rem}
.exbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin-inline:-16px;padding:10px 16px 8px;display:grid;gap:8px}
.exbar .row{justify-content:space-between}
.timer{font:700 1.15rem var(--f-mono);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.timer.warn{color:var(--cta)}
.exprog{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.exprog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.qno{font:800 1rem var(--f-display)}

/* ============ 進み具合（保存データ） ============ */
const LKEY = 'silver-step-v1';
const blank = () => ({v:1, updatedAt:0, xp:0, days:{}, qs:{}, found:[], conquered:[], exams:[], exam:null});
let P = blank();
try { const raw = JSON.parse(localStorage.getItem(LKEY) || 'null'); if (raw && raw.v === 1) P = Object.assign(blank(), raw); } catch(e) {}
let cloud = {ref:null, state:'device', writing:false, again:false, timer:null};

function today(){ const k = ymd(); return P.days[k] || (P.days[k] = {n:0, c:0, xp:0, peek:0, easy:0, rv:0, conq:0, chs:[], ms:[]}); }
function saveLocal(){ try { localStorage.setItem(LKEY, JSON.stringify(P)); } catch(e) {} }
function save(){
  P.updatedAt = Date.now(); saveLocal();
  if (cloud.ref) { clearTimeout(cloud.timer); cloud.timer = setTimeout(pushCloud, 1200); }
}
async function pushCloud(){
  if (!cloud.ref) return;
  if (cloud.writing) { cloud.again = true; return; }
  cloud.writing = true;
  try { await cloud.ref.set(JSON.parse(JSON.stringify(P))); cloud.state = 'cloud'; }
  catch(e) { if (e && e.code === 'invalid_argument') { cloud.ref = null; cloud.state = 'device'; } }
  cloud.writing = false;
  if (cloud.again) { cloud.again = false; pushCloud(); }
  paintSync();
}
async function connectCloud(){
  try {
    for (let i = 0; i < 20 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 150));
    if (!window.claude || !window.claude.use) return;
    const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
    if (!user || !db) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), 10000))]);
    cloud.ref = ref; cloud.state = 'cloud';
    if (snap.exists) {
      const d = snap.data();
      if (d && d.v === 1 && (d.updatedAt || 0) > (P.updatedAt || 0)) {
        P = Object.assign(blank(), JSON.parse(JSON.stringify(d)));
        saveLocal();
        if (view !== 'play') render();
      } else if ((P.updatedAt || 0) > (d.updatedAt || 0)) pushCloud();
    } else if (P.updatedAt) pushCloud();
    paintSync();
  } catch(e) { paintSync(); }
}
function paintSync(){ const el = document.getElementById('sync'); if (el) el.textContent = cloud.state === 'cloud' ? '記録はあなたのアカウントに保存されています（スマホとPCで共通）' : '記録はこの端末に保存されています'; }

/* ============ 集計 ============ */
const level = xp => { let L = 1, need = 60; while (xp >= need) { xp -= need; L++; need = 60 + (L - 1) * 30; } return {L, cur:xp, need}; };
const title = L => TITLES[Math.min(TITLES.length - 1, L - 1)];
const totals = () => { let n = 0, c = 0; Object.values(P.days).forEach(d => { n += d.n; c += d.c; }); return {n, c}; };
function streakInfo(){
  const t = ymd(); let s = 0, d = P.days[t] && P.days[t].n ? t : addDays(t, -1);
  while (P.days[d] && P.days[d].n) { s++; d = addDays(d, -1); }
  const keys = Object.keys(P.days).filter(k => P.days[k].n).sort();
  let best = 0, run = 0, prev = null;
  keys.forEach(k => { run = prev && addDays(prev, 1) === k ? run + 1 : 1; best = Math.max(best, run); prev = k; });
  return {s, best, todayDone: !!(P.days[t] && P.days[t].n)};
}
const clearedSet = () => new Set(Object.entries(P.qs).filter(([, v]) => v.c > 0).map(([k]) => k));

/* ============ ミッション ============ */
const MISSIONS = [
  {id:'one', t:'1問だけ解く', ok:d => d.n >= 1},
  {id:'three', t:'3問解く', ok:d => d.n >= 3},
  {id:'deep', t:'「もっと簡単に」か発見ノートを1回使う', ok:d => d.easy + d.rv >= 1}
];
function checkMissions(){
  const d = today(); const got = [];
  MISSIONS.forEach(m => { if (m.ok(d) && !d.ms.includes(m.id)) { d.ms.push(m.id); got.push(m); P.xp += XP.mission; d.xp += XP.mission; } });
  return got;
}
function announce(got, delay){ if (got.length) setTimeout(() => got.forEach(m => toast('ミッション達成：' + m.t + '　+' + XP.mission + 'XP')), delay || 0); }

/* ============ 画面の状態 ============ */
let view = 'home', S = null, XR = null;
let ui = {mode:'learn', ch:0, lv:0, count:3, peek:false, hint:false, easy:false, words:{}, revOpen:null, examKind:'full', sheet:null, xrFilter:'all'};
const shuffle = (arr, seed) => { const a = arr.slice(); let s = seed; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const orderFor = (q, seed) => q.fixed ? q.opts.map((_, j) => j) : shuffle(q.opts.map((_, j) => j), seed);

function dailyQuestion(){
  const cl = clearedSet(), t = ymd();
  const seed = t.split('-').reduce((a, b) => a * 31 + Number(b), 7);
  const pool = ALLQ.filter(q => !cl.has(q.id)).sort((a, b) => a.lv - b.lv || (a.fixed ? 1 : 0) - (b.fixed ? 1 : 0) || a.ch - b.ch);
  if (pool.length) { const f = pool[0]; const same = pool.filter(q => q.lv === f.lv && !!q.fixed === !!f.fixed); return same[seed % same.length]; }
  if (P.found.length) return QMAP[P.found[seed % P.found.length]];
  return ALLQ[seed % ALLQ.length];
}

function startSession(mode, ids){
  const seed = Date.now() % 100000;
  S = {mode, ids, i:0, res:[], xp:0, lvBefore:level(P.xp).L, order:ids.map((id, k) => orderFor(QMAP[id], seed + k * 17)), phase:'q', pick:[], sel:[], missions:[]};
  resetQ(); ui.revOpen = null;
  view = 'play'; render(); window.scrollTo({top:0});
}
const resetQ = () => { ui.peek = false; ui.hint = false; ui.easy = false; ui.words = {}; };
function pickIds(){
  let pool = ALLQ.filter(q => (!ui.ch || q.ch === ui.ch) && (!ui.lv || q.lv === ui.lv));
  const cl = clearedSet();
  pool = pool.slice().sort(() => Math.random() - .5).sort((a, b) => (cl.has(a.id) ? 1 : 0) - (cl.has(b.id) ? 1 : 0));
  return pool.slice(0, ui.count).map(q => q.id);
}

/* 1問の結果を記録（学習・テスト・本番で共通） */
function record(id, ok, d){
  const q = QMAP[id], rec = P.qs[id] || (P.qs[id] = {n:0, c:0});
  rec.n++; d.n++; if (!d.chs.includes(q.ch)) d.chs.push(q.ch);
  let conq = false;
  if (ok) { rec.c++; d.c++; if (P.found.includes(id)) { P.found = P.found.filter(x => x !== id); if (!P.conquered.includes(id)) P.conquered.push(id); d.conq++; conq = true; } }
  else if (!P.found.includes(id)) P.found.push(id);
  return conq;
}

function answer(sel){
  if (S.phase !== 'q') return;
  const id = S.ids[S.i], q = QMAP[id], ok = sameSet(sel, q.ans), d = today();
  const peeked = S.mode !== 'test' && ui.peek;
  let kind, gain;
  if (peeked) { const rec = P.qs[id] || (P.qs[id] = {n:0, c:0}); rec.n++; d.n++; if (!d.chs.includes(q.ch)) d.chs.push(q.ch); kind = 'peek'; gain = XP.peek; d.peek++; }
  else { const conq = record(id, ok, d); kind = ok ? (conq ? 'conq' : 'ok') : 'find'; gain = ok ? XP.ok + (conq ? XP.review : 0) : XP.find; }
  if (S.mode === 'review') d.rv++;
  P.xp += gain; d.xp += gain; S.xp += gain;
  S.res.push({id, kind, pick:sel.slice()});
  S.pick = sel.slice(); S.sel = [];
  const got = checkMissions(); got.forEach(() => { S.xp += XP.mission; }); S.missions.push(...got);
  save();
  if (S.mode === 'test') { announce(got, 0); next(); return; }
  S.phase = 'a'; render();
  if (kind === 'ok' || kind === 'conq') burst();
  announce(got, 600);
}
function next(){
  if (S.i < S.ids.length - 1) { S.i++; S.phase = 'q'; S.pick = []; S.sel = []; resetQ(); render(); window.scrollTo({top:0}); }
  else { view = 'result'; render(); window.scrollTo({top:0}); const lv = level(P.xp).L; if (lv > S.lvBefore) setTimeout(() => levelUp(lv), 500); else if (S.res.some(r => r.kind === 'ok' || r.kind === 'conq')) burst(); }
}

/* ============ 本番モード ============ */
function buildExam(n){
  const byCh = {}; ALLQ.forEach(q => (byCh[q.ch] = byCh[q.ch] || []).push(q));
  Object.values(byCh).forEach(a => a.sort(() => Math.random() - .5));
  const chs = Object.keys(byCh).sort(() => Math.random() - .5), ids = [];
  for (let k = 0; ids.length < n && k < 5000; k++) { const a = byCh[chs[k % chs.length]]; if (a.length) ids.push(a.pop().id); }
  return ids.sort(() => Math.random() - .5);
}
function startExam(kind){
  const c = EXAM[kind], ids = buildExam(c.n), seed = Date.now() % 100000;
  P.exam = {kind, ids, sel:{}, flag:[], i:0, elapsed:0, limit:c.min * 60000, order:ids.map((id, k) => orderFor(QMAP[id], seed + k * 13))};
  save(); ui.sheet = null; view = 'exam'; render(); window.scrollTo({top:0});
}
function submitExam(auto){
  const E = P.exam; if (!E) return;
  const d = today(), lvBefore = level(P.xp).L;
  const prevBest = P.exams.filter(x => x.total === E.ids.length).reduce((m, x) => Math.max(m, x.correct), -1);
  const res = E.ids.map((id, k) => { const s = E.sel[k] || [], q = QMAP[id]; const ok = s.length > 0 && sameSet(s, q.ans); return {id, k, ok, answered:s.length > 0, sel:s}; });
  let conq = 0; res.forEach(r => { if (r.answered && record(r.id, r.ok, d)) conq++; });
  const correct = res.filter(r => r.ok).length, used = Math.min(E.elapsed, E.limit);
  const gain = correct * XP.examOk + XP.examDone; P.xp += gain; d.xp += gain;
  const pct = Math.round(correct / E.ids.length * 100);
  P.exams.push({date:ymd(), kind:E.kind, total:E.ids.length, correct, pct, used, auto:!!auto});
  if (P.exams.length > 50) P.exams = P.exams.slice(-50);
  const got = checkMissions();
  XR = {E, res, correct, gain, pct, used, auto:!!auto, prevBest, conq, got};
  P.exam = null; ui.sheet = null; ui.xrFilter = 'all'; ui.revOpen = null; save();
  view = 'examResult'; render(); window.scrollTo({top:0});
  if (correct / E.ids.length >= PASS) burst();
  const lv = level(P.xp).L; if (lv > lvBefore) setTimeout(() => levelUp(lv), 900);
  announce(got, 1200);
}
setInterval(() => {
  if (view !== 'exam' || !P.exam || document.visibilityState !== 'visible') return;
  P.exam.elapsed += 1000; paintTimer();
  if (P.exam.elapsed >= P.exam.limit) { toast('時間になりました。ここまでの答えで採点します'); submitExam(true); return; }
  if (P.exam.elapsed % 10000 === 0) saveLocal();
}, 1000);
function paintTimer(){
  const el = document.getElementById('timer'); if (!el || !P.exam) return;
  const left = P.exam.limit - P.exam.elapsed; el.lastChild.textContent = '残り ' + mmss(left);
  el.classList.toggle('warn', left <= 10 * 60000);
}

function homeHTML(){
  const q = dailyQuestion(), st = streakInfo(), tt = totals(), d = P.days[ymd()] || {n:0, ms:[]};
  let sTitle, sText;
  if (st.todayDone) { sTitle = st.s + '日連続で積み上げ中'; sText = '今日もできました。ここで終えても十分です。'; }
  else if (st.s > 0) { sTitle = '今日の1問で ' + (st.s + 1) + '日連続'; sText = '1問だけでも記録がつながります。'; }
  else if (tt.n > 0) { sTitle = 'おかえりなさい。また今日から'; sText = 'これまでに解いた ' + tt.n + '問は、ずっと残っています。'; }
  else { sTitle = 'ここからスタート'; sText = 'まずは今日の1問から。答えを見ながらでもOKです。'; }
  const ms = MISSIONS.map(m => { const done = (d.ms || []).includes(m.id); return '<div class="mission' + (done ? ' done' : '') + '"><span class="ck">' + (done ? I.check : '') + '</span><span class="mt">' + esc(m.t) + '</span><span class="mx">' + (done ? '達成' : '+' + XP.mission + 'XP') + '</span></div>'; }).join('');
  const resume = P.exam ? '<section class="card exam-card"><h2>本番モードの続き</h2><p>解答 ' + Object.values(P.exam.sel).filter(s => s.length).length + ' / ' + P.exam.ids.length + '問・残り ' + mmss(P.exam.limit - P.exam.elapsed) + '</p><button class="btn" data-resume>続きから再開</button></section>' : '';
  const qb = (go, extra, bg, fg, icon, label, sub) => '<button class="qbtn" data-go="' + go + '"' + extra + '><span class="ic" style="background:' + bg + ';color:' + fg + '">' + icon + '</span><span class="lbl">' + label + '<small>' + sub + '</small></span></button>';
  return topBar() + '<div class="stack" style="margin-top:14px">' + resume +
    '<section class="card hero"><span class="deco" aria-hidden="true">{ }</span><div class="meta"><span>第' + q.ch + '章 ' + esc(CH[q.ch]) + '</span><span>' + LV[q.lv] + '</span></div><h2>今日の1問</h2><p>' + esc(q.tag) + '。1分あれば解けます。</p><button class="btn" data-daily>1問だけやってみる</button></section>' +
    '<section class="card streak"><span class="flame">' + (st.todayDone || st.s ? I.flame : I.seed) + '</span><div><h3>' + esc(sTitle) + '</h3><p>' + esc(sText) + '</p></div></section>' +
    '<div class="quick">' +
      qb('pick', ' data-mode="learn"', 'var(--brand-soft)', 'var(--brand)', I.book, '学習モード', '答えを見ながらOK') +
      qb('pick', ' data-mode="test"', 'var(--cta-soft)', 'var(--cta)', I.bolt, 'テストモード', '数問で力試し') +
      qb('examIntro', '', 'var(--xp-soft)', 'var(--ink)', I.clock, '本番モード', '60問・90分') +
      qb('note', '', 'var(--find-soft)', 'var(--find)', I.gem, '発見ノート', P.found.length + '問') +
    '</div>' +
    '<section class="card"><div class="sec-h"><h3>今日のミッション</h3><span class="small muted">' + (d.ms || []).length + ' / 3</span></div>' + ms + '</section>' +
    '<section class="card"><div class="sec-h"><h3>これまでの積み上げ</h3><button class="link" data-go="today">今日のふりかえり</button></div><div class="tiles"><div class="tile"><b>' + tt.n + '</b><span>解いた問題</span></div><div class="tile"><b>' + tt.c + '</b><span>クリア</span></div><div class="tile"><b>' + P.conquered.length + '</b><span>克服した発見</span></div></div></section>' +
    '<p class="sync" id="sync"></p></div>';
}

function pickHTML(){
  const cl = clearedSet();
  const chChips = '<button class="chip" data-ch="0" aria-pressed="' + (ui.ch === 0) + '">おまかせ</button>' + Object.keys(CH).map(n => { const tot = ALLQ.filter(q => q.ch === +n).length, done = ALLQ.filter(q => q.ch === +n && cl.has(q.id)).length; return '<button class="chip" data-ch="' + n + '" aria-pressed="' + (ui.ch === +n) + '">' + n + ' ' + esc(CH[n]) + '<small>' + done + '/' + tot + '</small></button>'; }).join('');
  const lvChips = [0,1,2,3].map(l => '<button class="chip" data-lv="' + l + '" aria-pressed="' + (ui.lv === l) + '">' + (l ? LV[l] : 'すべて') + '</button>').join('');
  const cnt = [1,3,5].map(c => '<button class="chip" data-count="' + c + '" aria-pressed="' + (ui.count === c) + '">' + c + '問' + (c === 1 ? 'だけ' : '') + '</button>').join('');
  const avail = ALLQ.filter(q => (!ui.ch || q.ch === ui.ch) && (!ui.lv || q.lv === ui.lv)).length;
  const info = ui.mode === 'learn' ? 'ヒントや「答えを見てから解く」が使えます。1問ごとに解説が出ます。攻略本を見ながら進めるイメージです。' : 'ヒントなしで、最後にまとめて結果と解説を見ます。間違えた問題は「発見ノート」に入ります。';
  return '<div class="stack"><h1 style="font-size:1.35rem">学ぶ</h1>' +
    '<div class="seg" role="group" aria-label="モード"><button data-mode-set="learn" aria-pressed="' + (ui.mode === 'learn') + '">学習モード</button><button data-mode-set="test" aria-pressed="' + (ui.mode === 'test') + '">テストモード</button></div>' +
    '<p class="modeinfo">' + info + '</p>' +
    '<section class="card"><h3 style="font-size:.95rem;margin-bottom:8px">分野</h3><div class="chips">' + chChips + '</div></section>' +
    '<section class="card"><h3 style="font-size:.95rem;margin-bottom:8px">難しさ</h3><div class="chips">' + lvChips + '</div></section>' +
    '<section class="card"><h3 style="font-size:.95rem;margin-bottom:8px">問題数</h3><div class="chips">' + cnt + '</div><p class="small muted" style="margin:8px 0 0">スキマ時間なら1問だけでも十分です。</p></section>' +
    '<button class="btn cta wide" data-start' + (avail ? '' : ' disabled') + '>' + (avail ? 'はじめる（' + Math.min(ui.count, avail) + '問）' : 'この条件の問題はまだありません') + '</button>' +
    '<section class="card exam-card"><h2>本番モード</h2><p>60問・90分・合格ライン65%。本番と同じ時間配分で通しで解きます。</p><button class="btn" data-go="examIntro">本番モードへ</button></section></div>';
}

function optsHTML(q, order, state){
  // state: {phase:'q'|'a', sel:[], pick:[], peek:bool, locked:bool}
  return '<div class="opts">' + order.map((j, k) => {
    let cls = 'opt';
    if (state.phase === 'a') { if (q.ans.includes(j)) cls += ' is-ok'; else if (state.pick.includes(j)) cls += ' is-mine'; }
    else { if (state.sel.includes(j)) cls += ' sel'; if (state.peek && q.ans.includes(j)) cls += ' peek'; }
    const txt = q.opts[j], jp = /[ぁ-んァ-ン一-龥]/.test(txt) && !txt.includes('\n');
    return '<button class="' + cls + '" data-opt="' + j + '"' + (state.phase === 'a' ? ' disabled' : '') + (state.phase === 'q' && q.ans.length > 1 ? ' aria-pressed="' + state.sel.includes(j) + '"' : '') + '><span class="k">' + LET[k] + '</span><span class="t' + (jp ? ' jp' : '') + '">' + esc(txt) + '</span></button>';
  }).join('') + '</div>';
}

function playHTML(){
  const id = S.ids[S.i], q = QMAP[id], order = S.order[S.i], learn = S.mode !== 'test', multi = q.ans.length > 1;
  const dots = S.ids.map((x, k) => { const r = S.res[k]; return '<i class="' + (k === S.i && S.phase === 'q' ? 'now' : r ? (r.kind === 'find' ? 'find' : 'ok') : '') + '"></i>'; }).join('');
  const modeName = S.mode === 'test' ? 'テスト' : S.mode === 'review' ? '見直し' : S.mode === 'daily' ? '今日の1問' : '学習';
  let o = '<div class="qtop"><button class="qclose" data-quit aria-label="やめる">' + I.x + '</button><div class="qprog">' + dots + '</div><span class="small muted">' + (S.i + 1) + '/' + S.ids.length + '</span></div>';
  o += '<div class="card"><div class="qmeta"><span class="tag">' + modeName + '</span><span class="tag">第' + q.ch + '章 ' + esc(CH[q.ch]) + '</span><span class="stars" aria-label="' + LV[q.lv] + '">' + '★'.repeat(q.lv) + '<span style="opacity:.3">' + '★'.repeat(3 - q.lv) + '</span> ' + LV[q.lv] + '</span>' + (multi ? '<span class="pickn">' + q.ans.length + 'つ選択</span>' : '') + '</div>';
  o += '<p class="qtext">' + fmt(q.q) + '</p>' + (q.code ? codeBlock(q.code) : '') + (q.cmd ? '<div class="cmd">' + esc(q.cmd) + '</div>' : '');
  if (learn && S.phase === 'q') {
    o += '<div class="helpers">' + (q.hint ? '<button class="chip" data-hint aria-pressed="' + ui.hint + '">ヒント</button>' : '') + '<button class="chip" data-peek aria-pressed="' + ui.peek + '">答えを見てから解く</button></div>';
    if (ui.hint && q.hint) o += '<div class="hintbox">' + fmt(q.hint) + '</div>';
    if (ui.peek) o += '<p class="peeknote">点線の選択肢が答えです。理由を考えながら選んでみよう。</p>';
  }
  o += optsHTML(q, order, {phase:S.phase, sel:S.sel, pick:S.pick, peek:learn && ui.peek});
  if (S.phase === 'q' && multi) o += '<button class="btn cta wide commit" data-commit' + (S.sel.length === q.ans.length ? '' : ' disabled') + '>' + (S.sel.length === q.ans.length ? 'これで決定' : 'あと ' + (q.ans.length - S.sel.length) + 'つ選んでください') + '</button>';
  o += '</div>';
  if (S.phase === 'a') {
    const r = S.res[S.res.length - 1];
    const fb = {
      ok:['ok','クリア！','理由まで分かっていたら完璧です。'],
      conq:['ok','発見を克服！','前につまずいた問題を乗り越えました。ノートから卒業です。'],
      find:['find','発見！','伸びしろを1つ見つけました。発見ノートに入れておきます。'],
      peek:['peek','なぞれた！','答えを見ながら理由を確かめるのも立派な練習です。']}[r.kind];
    const gain = {ok:XP.ok, conq:XP.ok + XP.review, find:XP.find, peek:XP.peek}[r.kind];
    o += '<div class="fb ' + fb[0] + '"><span class="xpg">+' + gain + 'XP</span><h2>' + fb[1] + '</h2><p>' + fb[2] + '</p></div>';
    o += explainHTML(q, order);
    o += '<div class="sticky-next"><button class="btn cta wide" data-next>' + (S.i < S.ids.length - 1 ? '次の問題へ' : '結果を見る') + '</button></div>';
  }
  return o;
}

function explainHTML(q, order){
  const letters = q.ans.map(j => LET[order.indexOf(j)]).sort().join('・');
  let o = '<div class="exp"><section class="card"><h3 style="font-size:.9rem;margin-bottom:4px" class="muted">ひとことで言うと（答え：' + letters + '）</h3><p class="one" style="margin:0">' + fmt(q.one) + '</p></section>';
  o += '<section class="card"><h3 style="font-size:.9rem;margin-bottom:10px" class="muted">' + esc(q.flowTitle || '動きの流れ') + '</h3><div class="flow">' + q.flow.map((f, i) => '<div><b>' + (i + 1) + '</b><span>' + fmt(f) + '</span></div>').join('') + '</div>';
  if (q.table) o += '<div class="tbl"><table><caption>' + esc(q.table.cap) + '</caption><thead><tr>' + q.table.head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' + q.table.rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  o += '</section>';
  if (q.easy) o += ui.easy ? '<section class="easy"><h3>もっと簡単に言うと</h3><p style="margin:0">' + fmt(q.easy) + '</p></section>' : '<button class="btn ghost wide" data-easy>' + I.light + 'もっと簡単に</button>';
  if (q.notes) o += '<section class="card"><h3 style="font-size:.9rem;margin-bottom:8px" class="muted">選択肢ごとの解説</h3><ul class="nl">' + order.map((j, k) => { const g = q.ans.includes(j); return '<li><span class="v ' + (g ? 'o' : 'x') + '">' + (g ? '○' : '×') + '</span><div><span class="k">' + LET[k] + '</span>' + fmt(q.notes[j]) + '</div></li>'; }).join('') + '</ul></section>';
  if (q.words) o += '<section><h3 style="font-size:.9rem;margin-bottom:6px" class="muted">言葉をタップで確認</h3><div class="words">' + q.words.map((w, i) => '<button class="word" data-word="' + i + '" aria-expanded="' + !!ui.words[i] + '">' + esc(w[0]) + (ui.words[i] ? '<small>' + esc(w[1]) + '</small>' : '') + '</button>').join('') + '</div></section>';
  o += '<div class="tipline">' + I.star + '<span>' + fmt(q.tip) + '</span></div></div>';
  return o;
}

function resultHTML(){
  const ok = S.res.filter(r => r.kind === 'ok' || r.kind === 'conq').length, found = S.res.filter(r => r.kind === 'find').length, peek = S.res.filter(r => r.kind === 'peek').length, conq = S.res.filter(r => r.kind === 'conq').length;
  const head = S.mode === 'test' ? '<div class="num">' + ok + '<span style="font-size:1.2rem;color:var(--muted)"> / ' + S.res.length + '</span></div><h1>' + S.res.length + '問中 ' + ok + '問クリア！</h1>' : '<div class="num">+' + S.xp + '<span style="font-size:1.2rem;color:var(--muted)">XP</span></div><h1>' + S.res.length + '問やりきりました！</h1>';
  let o = '<div class="stack"><section class="card big">' + head + '<p class="muted" style="margin:6px 0 0">' + esc(cheer(ok, S.res.length)) + '</p></section>';
  o += '<section class="done-list">' + doneItem(I.check, 'var(--ok-soft)', 'var(--ok)', 'クリアした問題', ok) + (conq ? doneItem(I.gem, 'var(--find-soft)', 'var(--find)', '克服した発見', conq) : '') + (found ? doneItem(I.gem, 'var(--find-soft)', 'var(--find)', '見つけた伸びしろ', found) : '') + (peek ? doneItem(I.book, 'var(--brand-soft)', 'var(--brand)', '答えを見てなぞった問題', peek) : '') + doneItem(I.star, 'var(--xp-soft)', 'var(--xp)', 'もらった経験値', '+' + S.xp) + '</section>';
  if (S.missions.length) o += '<section class="card"><h3 style="font-size:.95rem;margin-bottom:4px">達成したミッション</h3>' + S.missions.map(m => '<div class="mission done"><span class="ck">' + I.check + '</span><span class="mt">' + esc(m.t) + '</span><span class="mx">+' + XP.mission + 'XP</span></div>').join('') + '</section>';
  if (S.mode === 'test') o += '<section class="card"><h3 style="font-size:.95rem;margin-bottom:8px">1問ずつ見直す</h3><div class="rev">' + S.res.map((r, k) => reviewItem(QMAP[r.id], S.order[k], r.kind === 'ok' || r.kind === 'conq', r.pick, k)).join('') + '</div></section>';
  o += '<button class="btn cta wide" data-onemore>もう1問だけ</button><div class="row"><button class="btn ghost" style="flex:1" data-go="home">ホームへ</button><button class="btn ghost" style="flex:1" data-go="today">今日のふりかえり</button></div></div>';
  return o;
}
function reviewItem(q, order, good, pick, k, unanswered){
  const letters = q.ans.map(j => LET[order.indexOf(j)]).sort().join('・');
  const mine = pick && pick.length ? pick.map(j => LET[order.indexOf(j)]).sort().join('・') : '－';
  const state = unanswered ? '未回答' : good ? 'クリア' : '発見（ノートに追加）';
  return '<button class="revq" data-revopen="' + k + '"><span class="dot" style="background:' + (good ? 'var(--ok)' : unanswered ? 'var(--line)' : 'var(--find)') + '"></span><span class="tx"><b>' + esc(q.tag) + '</b><span>' + state + '・正解 ' + letters + (good ? '' : '・あなた ' + mine) + '</span></span></button>' + (ui.revOpen === k ? '<div style="margin:4px 0 8px">' + explainHTML(q, order) + '</div>' : '');
}
const doneItem = (ic, bg, fg, label, val) => '<div class="done-item"><span class="ic" style="background:' + bg + ';color:' + fg + '">' + ic + '</span><span>' + esc(label) + '</span><b>' + val + '</b></div>';
function cheer(ok, n){ const msgs = ok === n ? ['全部クリア。積み上げが形になっています。','完璧です。今日はここで終えても最高の1日です。'] : ok > 0 ? ['できた問題がちゃんと増えています。','クリアした分だけ、確実に前に進みました。'] : ['挑戦した分だけ、次に解ける問題が増えます。','伸びしろが見つかった日は、伸びる準備ができた日です。']; return msgs[(n + ok) % msgs.length]; }

/* ---- 本番モードの画面 ---- */
function examIntroHTML(){
  const hist = P.exams.slice(-3).reverse();
  const best = P.exams.filter(x => x.total === 60).reduce((m, x) => Math.max(m, x.pct), -1);
  let o = '<div class="stack"><div class="row"><button class="qclose" data-go="pick" aria-label="戻る">' + I.x + '</button><h1 style="font-size:1.35rem">本番モード</h1></div>';
  o += '<div class="facts"><div><b>60</b><span>問題数</span></div><div><b>90</b><span>試験時間（分）</span></div><div><b>65%</b><span>合格ライン（39問）</span></div></div>';
  o += '<section class="card"><h3 style="font-size:.95rem;margin-bottom:6px">本番と同じところ</h3><ul class="notes-list"><li>全章から出題。「2つ選択」の問題もあります</li><li>ヒントや解説は出ません。採点は最後にまとめて</li><li>見直しマークと問題一覧で、あとから戻れます</li><li>時間になったら自動で採点します</li></ul>';
  o += '<h3 style="font-size:.95rem;margin:12px 0 6px">このアプリならでは</h3><ul class="notes-list"><li>途中でやめても続きから再開できます（タイマーは画面を開いている間だけ進みます）</li><li>結果は「できた数」と「合格ラインまでの距離」で見せます</li><li>本番の目安は1問 約1.5分です</li></ul></section>';
  o += '<div class="kind" role="group" aria-label="長さ">' + Object.entries(EXAM).map(([k, c]) => '<button data-kind="' + k + '" aria-pressed="' + (ui.examKind === k) + '"><span class="ic" style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:0 0 auto">' + I.clock + '</span><span><b>' + c.label + '</b><small>' + c.sub + '</small></span></button>').join('') + '</div>';
  o += P.exam ? '<button class="btn cta wide" data-resume>中断中の本番モードを再開</button><button class="link" data-newexam>新しく始める（中断中のものは採点せずに終了）</button>' : '<button class="btn cta wide" data-examstart>スタート</button>';
  if (hist.length) o += '<section class="card"><h3 style="font-size:.95rem;margin-bottom:8px">最近の結果' + (best >= 0 ? '<span class="small muted">（60問のベスト ' + best + '%）</span>' : '') + '</h3><div class="hist">' + hist.map(h => '<div><span>' + h.date.slice(5).replace('-', '/') + '</span><span class="small muted">' + h.total + '問</span>' + (h.pct >= 65 ? '<span class="pass">合格ライン突破</span>' : '') + '<b>' + h.correct + '問 / ' + h.pct + '%</b></div>').join('') + '</div></section>';
  return o + '</div>';
}

function examHTML(){
  const E = P.exam; if (!E) { view = 'home'; return homeHTML(); }
  const k = E.i, q = QMAP[E.ids[k]], order = E.order[k], sel = E.sel[k] || [], multi = q.ans.length > 1;
  const answered = Object.values(E.sel).filter(s => s.length).length, flagged = E.flag.includes(k);

  o += '<p class="qtext">' + fmt(q.q) + '</p>' + (q.code ? codeBlock(q.code) : '') + (q.cmd ? '<div class="cmd">' + esc(q.cmd) + '</div>' : '');
  o += optsHTML(q, order, {phase:'q', sel, pick:[], peek:false}) + '</div>';
  o += '<p class="small muted" style="text-align:center;margin:10px 0 70px">解答 ' + answered + ' / ' + E.ids.length + '問</p>';
  o += '<nav class="exnav" aria-label="問題の移動"><div><button class="btn ghost" data-exmove="-1"' + (k === 0 ? ' disabled' : '') + '>前へ</button>' + (k === E.ids.length - 1 ? '<button class="btn cta" data-sheet="submit">提出へ</button>' : '<button class="btn cta" data-exmove="1">次へ</button>') + '</div></nav>';
  if (ui.sheet === 'nav') {
    o += '<div class="sheet-bg" data-sheet=""></div><section class="sheet" role="dialog" aria-label="問題一覧"><div><div class="row" style="justify-content:space-between"><h2 style="font-size:1.1rem">問題一覧</h2><button class="qclose" data-sheet="" aria-label="閉じる">' + I.x + '</button></div>' +
      '<div class="lg2"><span><i style="background:var(--brand-soft);border-color:var(--brand-soft)"></i>解答済み</span><span><i style="background:var(--xp);border-color:var(--xp);border-radius:50%"></i>見直しマーク</span><span><i></i>未回答</span></div>' +
      '<div class="grid60">' + E.ids.map((_, j) => '<button class="gq' + ((E.sel[j] || []).length ? ' ans' : '') + (E.flag.includes(j) ? ' flag' : '') + (j === k ? ' cur' : '') + '" data-jump="' + j + '">' + (j + 1) + '</button>').join('') + '</div>' +
      '<button class="btn cta wide" data-sheet="submit">提出する</button><button class="btn ghost wide" data-suspend>中断してホームへ（あとで再開）</button></div></section>';
  }
  if (ui.sheet === 'submit') {
    const un = E.ids.length - answered;
    o += '<div class="sheet-bg" data-sheet=""></div><section class="sheet" role="dialog" aria-label="提出の確認"><div><h2 style="font-size:1.15rem">提出しますか？</h2><div class="tiles"><div class="tile"><b>' + answered + '</b><span>解答済み</span></div><div class="tile"><b>' + un + '</b><span>未回答</span></div><div class="tile"><b>' + E.flag.length + '</b><span>見直しマーク</span></div></div>' +
      '<p class="small muted" style="margin:0">' + (un ? '未回答の問題は、選べば1問でも点になるかもしれません。本番でも、最後に全部埋めるのがおすすめです。' : '全問に答えました。見直しマークの問題を確認してから提出してもOKです。') + '</p>' +
      '<button class="btn cta wide" data-examsubmit>提出して採点する</button><button class="btn ghost wide" data-sheet="nav">問題一覧に戻る</button></div></section>';
  }
  return o;
}

function examResultHTML(){
  if (!XR) { view = 'home'; return homeHTML(); }
  const R = XR, n = R.E.ids.length, need = Math.ceil(n * PASS), passed = R.correct >= need;
  const byCh = {}; R.res.forEach(r => { const c = QMAP[r.id].ch; const b = byCh[c] || (byCh[c] = {n:0, c:0}); b.n++; if (r.ok) b.c++; });
  const best = Object.entries(byCh).sort((a, b) => b[1].c / b[1].n - a[1].c / a[1].n)[0];
  let msg = passed ? '合格ラインを突破しました。本番でもこの調子で。' : '合格ラインまで、あと ' + (need - R.correct) + '問です。';
  if (R.prevBest >= 0 && R.correct > R.prevBest) msg += ' 前回までのベストより +' + (R.correct - R.prevBest) + '問！';
  let o = '<div class="stack"><section class="card big"><div class="num">' + R.correct + '<span style="font-size:1.2rem;color:var(--muted)"> / ' + n + '問</span></div><h1>' + (passed ? '合格ライン突破！' : R.correct + '問 正解できました') + '</h1><p class="muted" style="margin:4px 0 0">' + esc(msg) + '</p>' +
    '<div class="passbar" aria-label="正答率 ' + R.pct + '%"><i style="width:' + R.pct + '%"></i><b style="left:65%"></b><span style="left:65%">合格ライン 65%</span></div><p class="small muted" style="margin:0;text-align:left">正答率 ' + R.pct + '%</p></section>';
  o += '<section class="done-list">' + doneItem(I.check, 'var(--ok-soft)', 'var(--ok)', '正解した問題', R.correct) + doneItem(I.clock, 'var(--brand-soft)', 'var(--brand)', R.auto ? '時間いっぱいまで粘った' : 'かかった時間', Math.round(R.used / 60000) + '分 / ' + Math.round(R.E.limit / 60000) + '分') + (R.conq ? doneItem(I.gem, 'var(--find-soft)', 'var(--find)', '克服した発見', R.conq) : '') + doneItem(I.star, 'var(--xp-soft)', 'var(--xp)', 'もらった経験値', '+' + R.gain) + '</section>';
  o += '<section class="card"><h3 style="font-size:.95rem;margin-bottom:8px">章ごとの正解' + (best ? '<span class="small muted">（いちばん得意：第' + best[0] + '章）</span>' : '') + '</h3><div class="stack" style="gap:8px">' + Object.keys(byCh).sort().map(c => '<div class="chbar"><span>第' + c + '章</span><span class="bar"><i style="width:' + (byCh[c].c / byCh[c].n * 100) + '%"></i></span><span>' + byCh[c].c + '/' + byCh[c].n + '</span></div>').join('') + '</div></section>';
  const f = ui.xrFilter, list = R.res.filter(r => f === 'all' || (f === 'find' && r.answered && !r.ok) || (f === 'none' && !r.answered));
  const cnt = {all:R.res.length, find:R.res.filter(r => r.answered && !r.ok).length, none:R.res.filter(r => !r.answered).length};
  o += '<section class="card"><h3 style="font-size:.95rem;margin-bottom:8px">1問ずつ見直す</h3><div class="chips" style="margin-bottom:10px">' + [['all','すべて'],['find','発見した問題'],['none','未回答']].map(([k, l]) => '<button class="chip" data-xrf="' + k + '" aria-pressed="' + (f === k) + '">' + l + '<small>' + cnt[k] + '</small></button>').join('') + '</div><div class="rev">' + (list.length ? list.map(r => reviewItem(QMAP[r.id], R.E.order[r.k], r.ok, r.sel, r.k, !r.answered)).join('') : '<p class="small muted" style="margin:0">該当する問題はありません。</p>') + '</div></section>';
  o += (cnt.find ? '<button class="btn cta wide" data-go="note">発見ノートで見直す</button>' : '') + '<button class="btn ghost wide" data-go="home">ホームへ</button></div>';
  return o;
}

function noteHTML(){
  let o = '<div class="stack"><h1 style="font-size:1.35rem">発見ノート</h1><p class="muted small" style="margin:-6px 0 0">つまずいた問題は「伸びしろ」として集まります。もう一度クリアすると、ノートから卒業します。</p>';
  if (!P.found.length) {
    o += '<section class="card empty"><div class="ic">' + I.seed + '</div><h3>いまは空っぽです</h3><p class="muted small">問題を解いて伸びしろが見つかったら、ここに集まります。</p></section>';
  } else {
    o += '<button class="btn cta wide" data-review>まとめて見直す（' + Math.min(5, P.found.length) + '問）</button>';
    const byCh = {}; P.found.forEach(id => { const q = QMAP[id]; if (q) (byCh[q.ch] = byCh[q.ch] || []).push(q); });
    Object.keys(byCh).sort().forEach(ch => { o += '<section class="card"><h3 style="font-size:.92rem;margin-bottom:8px">第' + ch + '章 ' + esc(CH[ch]) + '<span class="small muted">　' + byCh[ch].length + '問</span></h3><div class="rev">' + byCh[ch].map(q => '<button class="revq" data-reviewone="' + q.id + '"><span class="dot" style="background:var(--find)"></span><span class="tx"><b>' + esc(q.tag) + '</b><span>' + LV[q.lv] + '・タップで1問だけ見直す</span></span></button>').join('') + '</div></section>'; });
  }
  o += '<section class="card"><div class="row"><span class="flame" style="background:var(--ok-soft)">' + I.gem.replace('currentColor','var(--ok)') + '</span><div><h3 style="font-size:1rem">克服した発見　' + P.conquered.length + '問</h3><p class="small muted" style="margin:0">一度つまずいて、乗り越えた問題の数です。</p></div></div></section></div>';
  return o;
}

function statsHTML(){
  const tt = totals(), st = streakInfo(), cl = clearedSet(), lv = level(P.xp);
  const days = []; for (let i = 13; i >= 0; i--) days.push(addDays(ymd(), -i));
  const max = Math.max(3, ...days.map(k => (P.days[k] || {}).n || 0));
  const W = 320, H = 130, bw = W / days.length;
  const bars = days.map((k, i) => { const d = P.days[k] || {n:0, c:0}; const h = d.n / max * (H - 24), hc = d.c / max * (H - 24), x = i * bw + 4; return '<rect x="' + x + '" y="' + (H - 18 - h) + '" width="' + (bw - 8) + '" height="' + h + '" rx="4" fill="var(--brand-soft)"/><rect x="' + x + '" y="' + (H - 18 - hc) + '" width="' + (bw - 8) + '" height="' + hc + '" rx="4" fill="var(--ok)"/>' + (i % 2 === 1 || i === 13 ? '<text x="' + (x + (bw - 8) / 2) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="9" fill="var(--muted)">' + (i === 13 ? '今日' : Number(k.slice(8))) + '</text>' : ''); }).join('');
  const chart = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="直近14日の解いた問題数"><line x1="0" x2="' + W + '" y1="' + (H - 18) + '" y2="' + (H - 18) + '" stroke="var(--line)"/>' + bars + '</svg>';
  const chs = Object.keys(CH).map(n => { const tot = ALLQ.filter(q => q.ch === +n).length, done = ALLQ.filter(q => q.ch === +n && cl.has(q.id)).length; return '<div class="chbar"><span>第' + n + '章</span><span class="bar"><i style="width:' + (tot ? done / tot * 100 : 0) + '%"></i></span><span>' + done + '/' + tot + '</span></div>'; }).join('');
  const ex = P.exams.slice(-5).reverse();
  const B = [
    ['はじめの1問', tt.n >= 1], ['3日連続', st.best >= 3], ['7日連続', st.best >= 7], ['10問クリア', tt.c >= 10],
    ['全章に挑戦', new Set(Object.keys(P.qs).map(id => QMAP[id] && QMAP[id].ch)).size >= 7], ['発見を克服', P.conquered.length >= 1], ['本番を完走', P.exams.some(x => x.total === 60)], ['合格ライン突破', P.exams.some(x => x.total === 60 && x.pct >= 65)]];
  return '<div class="stack"><h1 style="font-size:1.35rem">記録</h1>' +
    '<div class="tiles"><div class="tile"><b>' + tt.n + '</b><span>解いた問題</span></div><div class="tile"><b>' + tt.c + '</b><span>クリア</span></div><div class="tile"><b>' + st.best + '</b><span>最長の連続日数</span></div></div>' +
    '<section class="card chart"><h3 style="font-size:.95rem;margin-bottom:6px">直近14日の積み上げ</h3>' + chart + '<div class="legend"><span><i style="background:var(--brand-soft)"></i>解いた</span><span><i style="background:var(--ok)"></i>クリア</span></div></section>' +
    '<section class="card"><h3 style="font-size:.95rem;margin-bottom:8px">本番モードの記録</h3>' + (ex.length ? '<div class="hist">' + ex.map(h => '<div><span>' + h.date.slice(5).replace('-', '/') + '</span><span class="small muted">' + h.total + '問</span>' + (h.pct >= 65 ? '<span class="pass">合格ライン突破</span>' : '') + '<b>' + h.correct + '問 / ' + h.pct + '%</b></div>').join('') + '</div>' : '<p class="small muted" style="margin:0">まだありません。準備ができたら、ハーフ（30問）から試すのもおすすめです。</p>') + '</section>' +
    '<section class="card"><h3 style="font-size:.95rem;margin-bottom:8px">章ごとのクリア</h3><div class="stack" style="gap:8px">' + chs + '</div></section>' +
    '<section class="card"><h3 style="font-size:.95rem;margin-bottom:10px">バッジ</h3><div class="badges">' + B.map(b => '<div class="bdg' + (b[1] ? ' on' : '') + '"><span class="md">' + I.star + '</span>' + esc(b[0]) + (b[1] ? '' : '<span style="font-weight:500">これから</span>') + '</div>').join('') + '</div></section>' +
    '<p class="sync" id="sync"></p></div>';
}

function todayHTML(){
  const d = P.days[ymd()];
  const date = new Date(), wd = '日月火水木金土'[date.getDay()];
  let o = '<div class="stack"><div class="row"><button class="qclose" data-go="home" aria-label="ホームへ">' + I.x + '</button><h1 style="font-size:1.3rem">今日のふりかえり</h1></div><p class="muted" style="margin:-6px 0 0">' + (date.getMonth() + 1) + '月' + date.getDate() + '日（' + wd + '）</p>';
  if (!d || !d.n) {
    o += '<section class="card empty"><div class="ic">' + I.seed + '</div><h3>今日はまだこれから</h3><p class="muted small">1問だけでも、今日の積み上げになります。</p><button class="btn cta" data-daily style="margin-top:8px">今日の1問をやる</button></section>';
  } else {
    const exToday = P.exams.filter(x => x.date === ymd());
    o += '<section class="card big"><div class="num">' + d.n + '<span style="font-size:1.2rem;color:var(--muted)">問</span></div><h1>今日できたこと</h1><p class="muted" style="margin:4px 0 0">' + esc(dayMsg(d)) + '</p></section>';
    o += '<section class="done-list">' + doneItem(I.check, 'var(--ok-soft)', 'var(--ok)', 'クリアした問題', d.c) + (exToday.length ? doneItem(I.clock, 'var(--brand-soft)', 'var(--brand)', '本番モードを完走', exToday.length + '回') : '') + (d.conq ? doneItem(I.gem, 'var(--find-soft)', 'var(--find)', '克服した発見', d.conq) : '') + (d.easy ? doneItem(I.light.replace('var(--xp)', 'currentColor'), 'var(--xp-soft)', 'var(--xp)', '「もっと簡単に」で理解を深めた', d.easy + '回') : '') + (d.peek ? doneItem(I.book, 'var(--brand-soft)', 'var(--brand)', '答えを見てなぞった', d.peek) : '') + doneItem(I.star, 'var(--xp-soft)', 'var(--xp)', '今日の経験値', '+' + d.xp) + doneItem(I.flame, 'var(--xp-soft)', 'var(--xp)', 'ミッション達成', (d.ms || []).length + ' / 3') + '</section>';
    o += '<section class="card"><h3 style="font-size:.95rem;margin-bottom:8px">今日さわった分野</h3><div class="chips">' + d.chs.slice().sort().map(c => '<span class="chip" style="cursor:default">第' + c + '章 ' + esc(CH[c]) + '</span>').join('') + '</div></section>';
    o += '<button class="btn ghost wide" data-onemore>もう1問だけ</button>';
  }
  return o + '</div>';
}
function dayMsg(d){ if (d.n >= 30) return '本番さながらの量をこなした1日。本当におつかれさまでした。'; if (d.n >= 5) return 'しっかり積み上げた1日。おつかれさまでした。'; if (d.c >= 1) return 'クリアした問題があります。今日の自分をほめましょう。'; return '机に向かって1問やったこと自体が、いちばん大きな一歩です。'; }

/* ============ 演出 ============ */
function burst(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = document.createElement('div'); b.className = 'burst'; const colors = ['var(--ok)','var(--xp)','var(--cta)','var(--find)','var(--brand)'];
  for (let i = 0; i < 30; i++) { const p = document.createElement('i'); const a = Math.random() * Math.PI * 2, r = 70 + Math.random() * 130; p.style.setProperty('--dx', Math.cos(a) * r + 'px'); p.style.setProperty('--dy', Math.sin(a) * r - 40 + 'px'); p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg'); p.style.background = colors[i % colors.length]; b.appendChild(p); }
  document.body.appendChild(b); setTimeout(() => b.remove(), 1200);
}
const toastQ = []; let toastBusy = false;
function toast(t){ toastQ.push(t); if (!toastBusy) nextToast(); }
function nextToast(){ const t = toastQ.shift(); if (!t) { toastBusy = false; return; } toastBusy = true; const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(() => { el.remove(); nextToast(); }, 1900); }
function levelUp(L){
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = '<div class="lvup" role="dialog" aria-label="レベルアップ"><div class="ring">' + L + '</div><h2 style="font-size:1.4rem">レベルアップ！</h2><p class="muted" style="margin:4px 0 14px">称号「' + esc(title(L)) + '」になりました。</p><button class="btn cta wide" data-closeov>やった！</button></div>';
  document.body.appendChild(ov); burst();
}

/* ============ 操作 ============ */
document.addEventListener('click', e => {
  const b = e.target.closest('button, .sheet-bg'); if (!b) return;
  if (b.hasAttribute('data-closeov')) { b.closest('.overlay').remove(); return; }
  if (b.dataset.go) { if (b.dataset.mode) ui.mode = b.dataset.mode; view = b.dataset.go; ui.revOpen = null; render(); window.scrollTo({top:0}); return; }
  if (b.hasAttribute('data-daily')) { startSession('daily', [dailyQuestion().id]); return; }
  if (b.dataset.modeSet) { ui.mode = b.dataset.modeSet; render(); return; }
  if (b.dataset.ch !== undefined && view === 'pick') { ui.ch = +b.dataset.ch; render(); return; }
  if (b.dataset.lv !== undefined) { ui.lv = +b.dataset.lv; render(); return; }
  if (b.dataset.count) { ui.count = +b.dataset.count; render(); return; }
  if (b.hasAttribute('data-start')) { const ids = pickIds(); if (ids.length) startSession(ui.mode, ids); return; }
  if (b.hasAttribute('data-review')) { startSession('review', P.found.slice(0, 5)); return; }
  if (b.dataset.reviewone) { startSession('review', [b.dataset.reviewone]); return; }
  if (b.hasAttribute('data-onemore')) { const cl = clearedSet(); const pool = ALLQ.filter(q => !cl.has(q.id)); const q = pool.length ? pool[Math.floor(Math.random() * pool.length)] : ALLQ[Math.floor(Math.random() * ALLQ.length)]; startSession('learn', [q.id]); return; }
  if (b.hasAttribute('data-quit')) { view = S && S.res.length ? 'result' : 'home'; render(); window.scrollTo({top:0}); return; }
  if (b.dataset.opt !== undefined) {
    const j = +b.dataset.opt;
    if (view === 'exam') {
      const E = P.exam, q = QMAP[E.ids[E.i]], cur = E.sel[E.i] || [];
      if (q.ans.length === 1) E.sel[E.i] = cur[0] === j ? [] : [j];
      else if (cur.includes(j)) E.sel[E.i] = cur.filter(x => x !== j);
      else if (cur.length < q.ans.length) E.sel[E.i] = cur.concat(j);
      else { toast('選べるのは ' + q.ans.length + 'つまでです'); return; }
      save(); render(); return;
    }
    const q = QMAP[S.ids[S.i]];
    if (q.ans.length === 1) { answer([j]); return; }
    if (S.sel.includes(j)) S.sel = S.sel.filter(x => x !== j); else if (S.sel.length < q.ans.length) S.sel.push(j); else { toast('選べるのは ' + q.ans.length + 'つまでです'); return; }
    render(); return;
  }
  if (b.hasAttribute('data-commit')) { answer(S.sel.slice()); return; }
  if (b.hasAttribute('data-hint')) { ui.hint = !ui.hint; render(); return; }
  if (b.hasAttribute('data-peek')) { ui.peek = !ui.peek; render(); return; }
  if (b.hasAttribute('data-easy')) { ui.easy = true; const d = today(); d.easy++; const got = checkMissions(); if (S) { got.forEach(() => S.xp += XP.mission); S.missions.push(...got); } save(); render(); announce(got, 200); return; }
  if (b.dataset.word !== undefined) { const k = +b.dataset.word; ui.words[k] = !ui.words[k]; render(); return; }
  if (b.hasAttribute('data-next')) { next(); return; }
  if (b.dataset.revopen !== undefined) { const k = +b.dataset.revopen; ui.revOpen = ui.revOpen === k ? null : k; ui.easy = false; ui.words = {}; render(); return; }
  /* 本番モード */
  if (b.dataset.kind) { ui.examKind = b.dataset.kind; render(); return; }
  if (b.hasAttribute('data-examstart')) { startExam(ui.examKind); return; }
  if (b.hasAttribute('data-newexam')) { P.exam = null; save(); startExam(ui.examKind); return; }
  if (b.hasAttribute('data-resume')) { ui.sheet = null; view = 'exam'; render(); window.scrollTo({top:0}); return; }
  if (b.dataset.exmove) { P.exam.i = Math.max(0, Math.min(P.exam.ids.length - 1, P.exam.i + +b.dataset.exmove)); save(); render(); window.scrollTo({top:0}); return; }
  if (b.hasAttribute('data-flag')) { const E = P.exam; E.flag = E.flag.includes(E.i) ? E.flag.filter(x => x !== E.i) : E.flag.concat(E.i); save(); render(); return; }
  if (b.dataset.sheet !== undefined) { ui.sheet = b.dataset.sheet || null; render(); return; }
  if (b.dataset.jump !== undefined) { P.exam.i = +b.dataset.jump; ui.sheet = null; save(); render(); window.scrollTo({top:0}); return; }
  if (b.hasAttribute('data-suspend')) { ui.sheet = null; save(); view = 'home'; render(); window.scrollTo({top:0}); toast('中断しました。ホームの「続きから再開」で戻れます'); return; }
  if (b.hasAttribute('data-examsubmit')) { submitExam(false); return; }
  if (b.dataset.xrf) { ui.xrFilter = b.dataset.xrf; ui.revOpen = null; render(); return; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && view === 'exam' && P.exam) save(); });

render();
setTimeout(connectCloud, 0);
</script>
